name: Release Windows build

# Triggers on tags like v1.1.0, v2.0.0-rc1, etc.
# A push of the tag is enough — no need for a separate manual step.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write  # required for actions/create-release / softprops

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage Playwright Chromium into build/ms-playwright
        env:
          # build_exe.ps1 also sets this, but doing it here lets the cache step
          # (when we add one later) key off a stable path.
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\build\ms-playwright
        run: |
          New-Item -ItemType Directory -Force -Path $env:PLAYWRIGHT_BROWSERS_PATH | Out-Null
          python -m playwright install chromium

      - name: Regenerate logo assets
        run: python tools/generate_logo.py

      - name: Build the .exe with PyInstaller
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\build\ms-playwright
        run: pyinstaller HireFlow.spec --clean --noconfirm

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "v0.0.0-dev" }
          $clean = $tag.TrimStart("v")
          "tag=$tag"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$clean" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package dist as zip
        shell: pwsh
        run: |
          $name = "HireFlow-${{ steps.version.outputs.version }}-win64.zip"
          Compress-Archive -Path "dist\HireFlow\*" -DestinationPath "dist\$name" -Force
          "asset=dist\$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: package

      - name: Upload build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HireFlow-${{ steps.version.outputs.version }}-win64
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

      - name: Publish GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: HireFlow AI ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.asset }}
